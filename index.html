<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Passwörter">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
    <title>Lesbarer Passwort-Generator</title>
    <!-- Minimalistisches SVG-Favicon (Schloss-Symbol passend zum Theme) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234f46e5'/%3E%3Crect x='25' y='45' width='50' height='35' rx='8' fill='white'/%3E%3Cpath d='M35 45 V30 A15 15 0 0 1 65 30 V45' fill='none' stroke='white' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        :root {
            --tint: #5856d6; --label: #1c1c1e; --label2: rgba(60,60,67,.62); --sep: rgba(60,60,67,.18);
            --glass: rgba(255,255,255,.34); --edge: rgba(255,255,255,.65); --hi: rgba(255,255,255,.9);
            --shadow: 0 10px 40px rgba(70,50,150,.22);
            --bg: radial-gradient(60% 50% at 12% 8%, #ffbfe3 0, transparent 70%), radial-gradient(55% 55% at 92% 14%, #a3c9ff 0, transparent 70%),
                  radial-gradient(60% 60% at 75% 96%, #c4b0ff 0, transparent 70%), radial-gradient(50% 50% at 4% 92%, #9ff2e2 0, transparent 70%), #e9e5ff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --tint: #7d7aff; --label: #fff; --label2: rgba(235,235,245,.6); --sep: rgba(255,255,255,.14);
                --glass: rgba(44,44,66,.36); --edge: rgba(255,255,255,.2); --hi: rgba(255,255,255,.32);
                --shadow: 0 10px 40px rgba(0,0,0,.5);
                --bg: radial-gradient(60% 50% at 12% 8%, #5a1d55 0, transparent 70%), radial-gradient(55% 55% at 92% 14%, #1b3a80 0, transparent 70%),
                      radial-gradient(60% 60% at 75% 96%, #3a2486 0, transparent 70%), radial-gradient(50% 50% at 4% 92%, #0f5d63 0, transparent 70%), #0b0a18;
            }
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg) fixed; color: var(--label);
            font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        }
        .app { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
        h1 { margin: 0 4px 4px; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: .37px; display: flex; align-items: center; gap: 14px; }
        /* Liquid-Glass-Material: Blur + Sättigung, Kantenlicht, Glanzverlauf */
        .glass {
            position: relative; border-radius: 28px; background: var(--glass); border: 1px solid var(--edge);
            -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
            box-shadow: var(--shadow), inset 0 1.5px 0 var(--hi), inset 0 -1px 0 rgba(255,255,255,.1);
        }
        .glass::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
            background: linear-gradient(160deg, rgba(255,255,255,.45), rgba(255,255,255,0) 42%); }
        .badge { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; color: var(--tint); flex: none; }
        .card { padding: 16px 20px 20px; }
        .caption { font-size: 13px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--label2); margin-bottom: 6px; }
        #password-display {
            display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--label);
            font: 600 clamp(22px, 5.5vw, 30px)/1.3 ui-monospace, "SF Mono", Menlo, monospace; text-align: center; word-break: break-all;
            transition: opacity .15s, transform .15s;
        }
        #password-display.multi { text-align: left; font-size: 18px; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; min-height: 60px; cursor: pointer; }
        .row + .row { border-top: .5px solid var(--sep); }
        .row-title { font-weight: 500; display: block; }
        .row-sub { display: block; font-size: 13px; color: var(--label2); }
        /* iOS-Schalter */
        .switch { position: relative; width: 51px; height: 31px; flex: none; }
        .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; z-index: 2; cursor: pointer; }
        .track { position: absolute; inset: 0; border-radius: 99px; background: rgba(120,120,128,.32); transition: background .3s; }
        .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
            box-shadow: 0 3px 8px rgba(0,0,0,.25), 0 1px 1px rgba(0,0,0,.2); transition: transform .4s cubic-bezier(.3,1.4,.5,1); }
        .switch input:checked + .track { background: #34c759; }
        .switch input:checked + .track::after { transform: translateX(20px); }
        /* Stepper */
        .stepper { display: flex; align-items: center; background: rgba(120,120,128,.16); border-radius: 99px; overflow: hidden; }
        .stepper button { width: 46px; height: 38px; border: 0; background: transparent; color: var(--tint); font: 500 24px/1 inherit; cursor: pointer; touch-action: manipulation; }
        .stepper button:active { background: rgba(120,120,128,.25); }
        #num-passwords { width: 56px; height: 38px; border: 0; outline: 0; background: transparent; text-align: center; color: var(--label);
            font: 600 17px -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: textfield; -moz-appearance: textfield; }
        #num-passwords::-webkit-inner-spin-button, #num-passwords::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        /* Buttons */
        .btn { appearance: none; -webkit-appearance: none; border: 0; height: 54px; border-radius: 99px; display: flex; align-items: center; justify-content: center; gap: 8px;
            font: 600 17px -apple-system, system-ui, sans-serif; color: var(--tint); cursor: pointer; touch-action: manipulation;
            transition: transform .3s cubic-bezier(.3,1.5,.5,1), filter .2s; }
        .btn:active { transform: scale(.95); filter: brightness(.95); }
        .btn.glass { border: 1px solid var(--edge); }
        .btn.primary { color: #fff; border: 1px solid rgba(255,255,255,.45);
            background: linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,0) 55%), var(--tint);
            box-shadow: 0 10px 28px rgba(88,86,214,.45), inset 0 1.5px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(0,0,0,.12); }
        .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        /* Toast */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, 20px) scale(.9); } 10% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            90% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -12px) scale(.96); }
        }
        .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 28px); transform: translateX(-50%); z-index: 50;
            padding: 12px 20px; border-radius: 99px; display: flex; align-items: center; gap: 8px; font-weight: 600; opacity: 0; pointer-events: none; }
        .toast-animate { animation: fadeInOut 2.5s ease-in-out forwards; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>
    <!-- Verstecktes Element für sicheres Kopieren -->
    <span id="copy-helper" style="position: absolute; opacity: 0; pointer-events: none; white-space: pre-wrap;"></span>

    <main class="app">
        <h1><span class="badge glass"><svg width="26" height="26" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-68-56a12,12,0,1,1-12-12A12,12,0,0,1,140,152Z"/></svg></span>Passwort Generator</h1>

        <section class="glass card">
            <div class="caption">Ergebnis</div>
            <textarea id="password-display" rows="3" readonly spellcheck="false">Lade...</textarea>
        </section>

        <section class="glass">
            <label class="row">
                <span><span id="mode-text" class="row-title">Wort-basiert</span><span id="mode-sub" class="row-sub">Leicht zu merken</span></span>
                <span class="switch"><input type="checkbox" id="mode-toggle" checked><span class="track"></span></span>
            </label>
            <div class="row">
                <label for="num-passwords" class="row-title">Anzahl</label>
                <div class="stepper">
                    <button id="btn-minus" type="button" aria-label="Weniger">&minus;</button>
                    <input type="number" id="num-passwords" min="1" max="1000" value="1" inputmode="numeric">
                    <button id="btn-plus" type="button" aria-label="Mehr">+</button>
                </div>
            </div>
        </section>

        <button id="btn-generate" class="btn primary"><svg width="22" height="22" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M224,128a96,96,0,1,1-96-96,8,8,0,0,1,0,16,80,80,0,1,0,80,80,8,8,0,0,1,16,0Zm-34.34-61.66a8,8,0,0,1-11.32,11.32L160,59.31V88a8,8,0,0,1-16,0V40a8,8,0,0,1,8-8h48a8,8,0,0,1,0,16H171.31Z"/></svg>Neu Generieren</button>
        <div class="pair">
            <button id="btn-copy" class="btn glass"><svg width="22" height="22" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"/></svg>Kopieren</button>
            <button id="btn-export" class="btn glass"><svg width="22" height="22" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M224,144v64a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V144a8,8,0,0,1,16,0v64H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z"/></svg>CSV Export</button>
        </div>
    </main>

    <!-- Toast Benachrichtigung (wird per JS eingeblendet) -->
    <div id="toast" class="toast glass"><svg width="22" height="22" fill="#34c759" viewBox="0 0 256 256" aria-hidden="true"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM224,128A96,96,0,1,1,128,32,96.11,96.11,0,0,1,224,128Zm-16,0a80,80,0,1,0-80,80A80.09,80.09,0,0,0,208,128Z"/></svg>Passwort kopiert!</div>

    <script>
        // DOM Elemente
        const displayEl = document.getElementById('password-display');
        const btnGenerate = document.getElementById('btn-generate');
        const btnCopy = document.getElementById('btn-copy');
        const btnExport = document.getElementById('btn-export');
        const numPasswords = document.getElementById('num-passwords');
        const modeToggle = document.getElementById('mode-toggle');
        const modeSub = document.getElementById('mode-sub');
        const btnMinus = document.getElementById('btn-minus');
        const btnPlus = document.getElementById('btn-plus');
        const modeText = document.getElementById('mode-text');
        const toast = document.getElementById('toast');

        // Liste mit einfachen, deutschen Wörtern für gut lesbare Passwörter
        const words = [
            "Apfel", "Baum", "Katze", "Hund", "Maus", "Haus", "Auto", "Sonne", "Mond", "Stern", 
            "Wolke", "Regen", "Schnee", "Wind", "Feuer", "Wasser", "Erde", "Blume", "Wald", "Berg", 
            "Tal", "Fluss", "Meer", "See", "Vogel", "Fisch", "Buch", "Tisch", "Stuhl", "Bett", 
            "Uhr", "Schuh", "Hose", "Hemd", "Brille", "Kaffee", "Tee", "Milch", "Brot", "Käse", 
            "Birne", "Banane", "Traube", "Licht", "Farbe", "Bild", "Musik", "Spiel", "Reise", "Weg", 
            "Ziel", "Traum", "Glück", "Liebe", "Freude", "Mut", "Kraft", "Ruhe", "Zeit", "Jahr", 
            "Tag", "Nacht", "Morgen", "Abend", "Winter", "Sommer", "Herbst", "Lenz", "Gold", "Silber", 
            "Eisen", "Holz", "Stein", "Sand", "Glas", "Papier", "Stift", "Brief", "Wort", "Satz", 
            "Zahl", "Kreis", "Punkt", "Linie", "Form", "Klang", "Lied", "Tanz", "Fest", "Gast", 
            "Freund", "Kind", "Mensch", "Stadt", "Dorf", "Land", "Welt", "Raum", "Planet", "Insel"
        ];

        // Zeichen für klassische Passwörter (verwechselbare wie l, 1, I, O, 0 entfernt)
        const safeChars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789!@#$%&*+?";
        const symbols = "!@#$%&*+?";

        // Hilfsfunktion: Zufällige Zahl in einem Bereich
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Hilfsfunktion: Zufälliges Element aus einem Array/String
        function getRandomItem(collection) {
            return collection[Math.floor(Math.random() * collection.length)];
        }

        // Generiert ein wortbasiertes Passwort (z.B. ApfelBaumKatze42!)
        function generateWordPassword() {
            const word1 = getRandomItem(words);
            const word2 = getRandomItem(words);
            const word3 = getRandomItem(words);
            const number = getRandomInt(10, 99);
            const symbol = getRandomItem(symbols);
            
            return `${word1}${word2}${word3}${number}${symbol}`;
        }

        // Generiert ein zeichenbasiertes Passwort ohne verwirrende Zeichen
        function generateCharPassword() {
            let password = "";
            const length = 14; // Gute Länge für hohe Sicherheit
            for (let i = 0; i < length; i++) {
                password += getRandomItem(safeChars);
            }
            return password;
        }

        // Hauptfunktion zum Erstellen und Anzeigen
        function updatePassword() {
            // Kurze Animation für visuelles Feedback
            displayEl.style.opacity = '0.5';
            displayEl.style.transform = 'scale(0.98)';
            
            setTimeout(() => {
                const isWordMode = modeToggle.checked;
                const count = Math.max(1, parseInt(numPasswords.value) || 1); // Sicherheitscheck, mind. 1
                
                let newPasswords = [];
                for(let i = 0; i < count; i++) {
                    newPasswords.push(isWordMode ? generateWordPassword() : generateCharPassword());
                }
                
                // Setze die Werte in die Textarea
                displayEl.value = newPasswords.join('\n');
                
                // Bei mehreren Passwörtern linksbündig
                displayEl.classList.toggle('multi', count > 1);

                displayEl.style.opacity = '1';
                displayEl.style.transform = 'scale(1)';
            }, 150);
        }

        // Läuft die App als installierte Home-Bildschirm-App?
        const isStandalone = window.navigator.standalone === true ||
            window.matchMedia('(display-mode: standalone)').matches;

        // Kopieren über markierten Text im Hilfselement (funktioniert zuverlässig auf iOS/iPadOS)
        function legacyCopy(text) {
            const helper = document.getElementById('copy-helper');
            helper.textContent = text;

            const selection = window.getSelection();
            const range = document.createRange();
            let ok = false;

            try {
                range.selectNodeContents(helper);
                selection.removeAllRanges();
                selection.addRange(range);
                ok = document.execCommand('copy');
            } catch (err) {
                console.error('Kopieren fehlgeschlagen', err);
            } finally {
                // Unsichtbaren Platzhalter und leere Auswahl beibehalten (verhindert IndexSizeError)
                helper.textContent = '\u200B';
                const emptyRange = document.createRange();
                emptyRange.selectNodeContents(helper);
                selection.removeAllRanges();
                selection.addRange(emptyRange);
            }
            return ok;
        }

        // Kopiert den Text in die Zwischenablage
        function copyPassword() {
            const textToCopy = displayEl.value;
            if (!textToCopy) return;

            if (legacyCopy(textToCopy)) {
                showToast();
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(textToCopy).then(showToast)
                    .catch(err => console.error('Kopieren fehlgeschlagen', err));
            }
        }

        // CSV Export Funktion
        async function exportCSV() {
            const passwords = displayEl.value.split('\n').filter(p => p.trim() !== '');
            if (passwords.length === 0) return;

            // CSV Header und Inhalt zusammenbauen
            const csvContent = "Passwoerter\n" + passwords.join('\n');

            // Als installierte App (iPad): Teilen-Dialog nutzen (In Dateien sichern, AirDrop, Mail ...),
            // weil Downloads in Home-Bildschirm-Apps unter iOS/iPadOS unzuverlässig sind.
            if (isStandalone && navigator.canShare) {
                try {
                    const file = new File([csvContent], 'passwoerter.csv', { type: 'text/csv' });
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: 'Passwörter' });
                        return;
                    }
                } catch (err) {
                    if (err && err.name === 'AbortError') return; // Dialog abgebrochen
                }
            }

            // Standard: klassischer Download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);

            // Versteckten Link erstellen und Klick simulieren
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', 'passwoerter.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Zeigt die kleine Bestätigungsmeldung an
        function showToast() {
            // Animation zurücksetzen falls schon aktiv
            toast.classList.remove('toast-animate');
            void toast.offsetWidth; // Trigger Reflow
            toast.classList.add('toast-animate');
        }

        // UI Aktualisierung für den Schalter
        function updateToggleUI() {
            modeText.textContent = modeToggle.checked ? "Wort-basiert" : "Zeichen-basiert";
            modeSub.textContent = modeToggle.checked ? "Leicht zu merken" : "Ohne l, I, O, 0";
            updatePassword();
        }

        // Stepper für die Anzahl
        function stepCount(d) {
            numPasswords.value = Math.min(1000, Math.max(1, (parseInt(numPasswords.value) || 1) + d));
            updatePassword();
        }

        // Event Listener verknüpfen
        btnGenerate.addEventListener('click', updatePassword);
        btnCopy.addEventListener('click', copyPassword);
        btnExport.addEventListener('click', exportCSV);
        modeToggle.addEventListener('change', updateToggleUI);
        numPasswords.addEventListener('input', updatePassword); // Generiert neu bei Zahlenänderung
        btnMinus.addEventListener('click', () => stepCount(-1));
        btnPlus.addEventListener('click', () => stepCount(1));

        // Initiales Passwort beim Laden der Seite generieren
        updateToggleUI(); // Setzt UI und generiert erstes Passwort

        // Service Worker für den Offline-Betrieb registrieren
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error('Service Worker Fehler', err));
            });
        }
    </script>
</body>
</html>
